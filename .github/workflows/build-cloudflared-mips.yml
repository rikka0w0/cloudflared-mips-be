name: Build cloudflared 2022.10.3 for Linux 2.6.30 MIPS Big Endian

on:
  workflow_dispatch:

jobs:
  build:
    name: Build cloudflared 2022.10.3 MIPS BE softfloat
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Install exact Go version
      # ------------------------------------------------------------
      - name: Set up Go 1.18.10
        uses: actions/setup-go@v5
        with:
          go-version: "1.18.10"
          cache: false

      - name: Check Go version
        run: |
          go version
          go env

      # ------------------------------------------------------------
      # Pull cloudflared 2022.10.3
      # ------------------------------------------------------------
      - name: Clone cloudflared 2022.10.3
        run: |
          git clone \
            --depth 1 \
            --branch 2022.10.3 \
            https://github.com/cloudflare/cloudflared.git

          cd cloudflared

          echo "cloudflared source commit:"
          git rev-parse HEAD

          echo
          echo "cloudflared version/tag:"
          git describe --tags --always

          echo
          echo "go.mod:"
          head -5 go.mod

      # ------------------------------------------------------------
      # Build
      #
      # GOARCH=mips      -> 32-bit MIPS big endian
      # GOMIPS=softfloat -> software floating point
      # CGO_ENABLED=0    -> no CGO dependency
      # Go 1.18 still supports Linux 2.6.30-era kernels better than newer
      # runtimes.  Do not enable CGO: the target firmware has an old userland.
      # ------------------------------------------------------------
      - name: Build cloudflared
        working-directory: cloudflared
        shell: bash
        run: |
          set -euxo pipefail

          VER="2022.10.3"

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=mips \
          GOMIPS=softfloat \
          go build \
            -mod=readonly \
            -trimpath \
            -tags "netgo osusergo" \
            -ldflags="-s -w -buildid= -X main.Version=${VER}" \
            -o cloudflared-mips-be \
            ./cmd/cloudflared

      # ------------------------------------------------------------
      # Verify output
      # ------------------------------------------------------------
      - name: Check binary
        working-directory: cloudflared
        run: |
          set -eux

          file cloudflared-mips-be
          ls -lh cloudflared-mips-be

          sha256sum cloudflared-mips-be \
            > cloudflared-mips-be.sha256

          cat cloudflared-mips-be.sha256

      # ------------------------------------------------------------
      # Upload artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflared-2022.10.3-linux-2.6.30-mips-be-softfloat
          path: |
            cloudflared/cloudflared-mips-be
            cloudflared/cloudflared-mips-be.sha256
          if-no-files-found: error
          retention-days: 30
